name: Testes
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo-fonte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --prefix job
      - name: Ciencia (ETo, contorno, avisos, irrigacao) e rotina horaria
        run: npm test --prefix job
      - name: Agente do Raspberry
        run: python3 -m unittest discover -s edge -p 'test_*.py'
      - name: Regras de seguranca (firestore.rules) no emulador
        run: npx -y firebase-tools@15 emulators:exec --project demo-meteora --only firestore "node --test job/test/regras.emu.mjs"
